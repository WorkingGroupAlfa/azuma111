<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#171615">
<title>Azuma · Адмін</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Golos+Text:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- login -->
<section id="login" class="login" hidden>
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="brand"><span class="logo">AZUMA</span><span class="brand-sub">адмін-панель</span></div>
    <label class="fld">
      <span class="lbl">Пароль</span>
      <input id="pw" type="password" name="password" autocomplete="current-password" required>
    </label>
    <p id="loginErr" class="err" role="alert" hidden></p>
    <button id="loginBtn" class="btn primary wide" type="submit">Увійти</button>
  </form>
</section>

<!-- app -->
<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand"><span class="logo">AZUMA</span><span class="brand-sub">адмін</span></div>
      <nav class="views" aria-label="Розділи адмінки">
        <a href="#menu" data-view="menu" class="view-l">Меню</a>
        <a href="#stats" data-view="stats" class="view-l">Статистика</a>
      </nav>
      <div class="top-act">
        <a class="icon-btn" href="/" target="_blank" rel="noopener" title="Відкрити сайт" aria-label="Відкрити сайт">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        </a>
        <button id="logout" class="icon-btn" type="button" title="Вийти" aria-label="Вийти">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg>
        </button>
      </div>
    </div>
    <div id="menuTools" class="tools">
      <div class="tabs" role="tablist" aria-label="Розділ меню" id="tabs"></div>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input id="q" type="search" placeholder="Пошук по всіх позиціях" autocomplete="off" enterkeyhint="search" aria-label="Пошук по всіх позиціях">
      </label>
    </div>
  </header>

  <main id="menuView" class="wrap">
    <div id="loadState" class="state">Завантаження меню…</div>
    <div class="layout">
      <nav id="index" class="index" aria-label="Категорії"></nav>
      <div id="list" class="list"></div>
    </div>
  </main>

  <main id="statsView" class="wrap" hidden>
    <div class="stats-head">
      <h1>Статистика</h1>
      <div class="seg" role="group" aria-label="Період" id="period">
        <button type="button" data-days="7">7 днів</button>
        <button type="button" data-days="30" aria-pressed="true">30 днів</button>
        <button type="button" data-days="90">90 днів</button>
      </div>
    </div>
    <div id="statsBody"></div>
  </main>

  <main id="histView" class="wrap narrow" hidden>
    <div class="stats-head">
      <h1>Історія змін</h1>
      <a class="btn small ghost" href="#menu">← До меню</a>
    </div>
    <div id="histBody"></div>
  </main>

  <div id="savebar" class="savebar" hidden>
    <div class="savebar-in">
      <div id="saveMsg" class="save-msg" role="status" aria-live="polite"></div>
      <div id="saveActions" class="save-actions"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="/admin/admin.js"></script>
</body>
</html>
